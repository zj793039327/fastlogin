name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o fastlogin${{ matrix.goos == 'windows' && '.exe' || '' }} .

      - name: Package (unix)
        if: matrix.goos != 'windows'
        run: |
          tar -czf fastlogin_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz fastlogin
          shasum -a 256 fastlogin_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz > fastlogin_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256

      - name: Package (windows)
        if: matrix.goos == 'windows'
        run: |
          zip fastlogin_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip fastlogin.exe
          shasum -a 256 fastlogin_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip > fastlogin_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/fastlogin_*

  bump-tap:
    # 发布 Release 后，自动更新 homebrew-tap 仓库的 Formula 并推送
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fastlogin (for the formula template)
        uses: actions/checkout@v4

      - name: Compute formula values
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Fetch darwin sha256
        id: sha
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          ARM=$(curl -fsSL "${BASE}/fastlogin_${{ github.ref_name }}_darwin_arm64.tar.gz.sha256" | awk '{print $1}')
          INTEL=$(curl -fsSL "${BASE}/fastlogin_${{ github.ref_name }}_darwin_amd64.tar.gz.sha256" | awk '{print $1}')
          echo "arm=${ARM}" >> "$GITHUB_OUTPUT"
          echo "intel=${INTEL}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: zj793039327/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Update Formula from template
        run: |
          mkdir -p tap/Formula
          sed \
            -e "s|@REPO@|${{ github.repository }}|g" \
            -e "s|@VERSION@|${{ steps.vars.outputs.version }}|g" \
            -e "s|@TAG@|${{ github.ref_name }}|g" \
            -e "s|@ARM@|${{ steps.sha.outputs.arm }}|g" \
            -e "s|@INTEL@|${{ steps.sha.outputs.intel }}|g" \
            .github/formula-template.rb > tap/Formula/fastlogin.rb
          echo "=== Generated Formula ==="
          cat tap/Formula/fastlogin.rb

      - name: Commit & push
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/fastlogin.rb
          git commit -m "fastlogin ${{ steps.vars.outputs.version }}"
          git push

  bump-scoop:
    # 发布 Release 后，自动更新 scoop-bucket 仓库的 manifest 并推送
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Compute version
        id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch windows sha256
        id: sha
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          WIN=$(curl -fsSL "${BASE}/fastlogin_${{ github.ref_name }}_windows_amd64.zip.sha256" | awk '{print $1}')
          echo "win=${WIN}" >> "$GITHUB_OUTPUT"

      - name: Checkout scoop-bucket
        uses: actions/checkout@v4
        with:
          repository: zj793039327/scoop-bucket
          token: ${{ secrets.TAP_TOKEN }}
          path: bucket

      - name: Update manifest
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.vars.outputs.version }}"
          WIN="${{ steps.sha.outputs.win }}"
          REPO="${{ github.repository }}"

          URL="https://github.com/${REPO}/releases/download/${TAG}/fastlogin_${TAG}_windows_amd64.zip"

          jq \
            --arg version "${VERSION}" \
            --arg url "${URL}" \
            --arg hash "${WIN}" \
            '.version=$version | .architecture."64bit".url=$url | .architecture."64bit".hash=$hash' \
            bucket/fastlogin.json > bucket/fastlogin.json.tmp \
            && mv bucket/fastlogin.json.tmp bucket/fastlogin.json
          echo "=== Updated manifest ==="
          cat bucket/fastlogin.json

      - name: Commit & push
        run: |
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fastlogin.json
          git commit -m "fastlogin ${{ steps.vars.outputs.version }}"
          git push
